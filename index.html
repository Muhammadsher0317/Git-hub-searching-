<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammadsher's git hub website</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="">
    <div class="loader">
        <img src="https://cdn.pixabay.com/animation/2023/11/30/10/11/10-11-02-622_512.gif" alt="">
    </div>
    <header>
        <nav>
            <div class="container">
                <h1 >devfinder</h1> <button class="mode" >Light <i class="fa-solid fa-sun"></i></button>
            </div>
        </nav>
       <div class="hero">
        <div class="container">
            <form class="form">
                  <i id="icons" class="fa-solid fa-magnifying-glass"></i>
                     <input class="input" type="text" placeholder="Search GitHub username…">
                    <button type="submit" class="buttons">Search</button>
            </form>
        </div>
       </div>
    </header>
    <main>
        <section class="datamain">
            <div class="container">
                 <div class="datamainslar">
                    <div class="mainimg">
                    <img src="./imgs/Bitmap.svg" alt="">
                 </div>
                 <div class="datainfo">
                    <div class="namesline">
                        <h2>The Octocat </h2> <span class="createddate">Joined 25 Jan 2011</span>
                    </div>
                    <div class="datalinks">
                         <a href=""> @octocat</a>
                    </div>
                    <div class="bitolines">
                     <p>This profile has no bio</p>
                    </div>
                    <div class="followerwithfoloow">
                      <div class="repost">
                          <h1>Repos</h1>
                          <span>8</span>
                      </div>
                      <div class="Followers">
                        <h1>Followers</h1>
                        <span>3938</span>
                      </div>
                      <div class="Following">
                        <h1>Following</h1>
                        <span>9</span>
                      </div>
                    </div>
                    <div class="locations">
                        <p><i class="fa-solid fa-location-dot"></i> San Franc</p>
                        <p ><i class="fa-brands fa-twitter"></i>Not Available</p>
                        <p  ><i class="fa-solid fa-link"></i> <a class="linkslar" href="">https://github.blog</a></p>
                        <p > <i class="fa-solid fa-place-of-worship"></i> @github</p>
                    </div>
                 </div>
                 </div>
            </div>
        </section>
    </main>
</body>
<script src="main.js"></script>
</html>
